services:
  app:
    build:
      context: .
    ports:
      - "80:80"
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - frontend
      - backend
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?isi DB_DATABASE di .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?isi DB_PASSWORD di .env}
    # tidak ada "ports:" -> database tidak terbuka ke publik
    networks:
      - backend
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data: